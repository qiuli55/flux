name: Mobile Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/mobile-controller/**"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    paths:
      - "apps/mobile-controller/**"
      - ".github/workflows/mobile-android.yml"

# tag 构建完成后要把 APK 挂到 GitHub Release，作为发版下载源。
permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-controller

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 运行镜像已自带 Android SDK，但 cmdline-tools 的版本与 setup-android@v3
      # 预期不一致，走该 action 会卡在非交互的 --licenses 上（exit 1）。
      # 这里直接用镜像里的 sdkmanager：先显式接受许可，再装所需组件。
      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "${SDKMANAGER}" --licenses > /dev/null
          "${SDKMANAGER}" "platforms;android-34" "build-tools;34.0.0"

      # keystore 不进仓库，仓库 CI 用默认 debug 签名（仅验证编译）；
      # 配置了 FLUX_KEYSTORE_BASE64 时还原分发签名，保证产物可覆盖安装。
      - name: Restore signing keystore (optional)
        env:
          FLUX_KEYSTORE_BASE64: ${{ secrets.FLUX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$FLUX_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$FLUX_KEYSTORE_BASE64" | base64 -d > keystore/flux-release.jks
            echo "分发签名 keystore 已还原"
          else
            echo "未配置 FLUX_KEYSTORE_BASE64，使用默认 debug 签名（产物不可分发）"
          fi

      - name: Run JVM tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew assembleDebug --no-daemon
        env:
          FLUX_KEYSTORE_PASSWORD: ${{ secrets.FLUX_KEYSTORE_PASSWORD }}
          FLUX_KEY_PASSWORD: ${{ secrets.FLUX_KEY_PASSWORD }}
          FLUX_KEY_ALIAS: ${{ secrets.FLUX_KEY_ALIAS }}

      # tag 走 release 构建：与历史发版包同一 buildType，签名由上面的 keystore 还原步骤保证。
      - name: Assemble release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleRelease --no-daemon
        env:
          FLUX_KEYSTORE_PASSWORD: ${{ secrets.FLUX_KEYSTORE_PASSWORD }}
          FLUX_KEY_PASSWORD: ${{ secrets.FLUX_KEY_PASSWORD }}
          FLUX_KEY_ALIAS: ${{ secrets.FLUX_KEY_ALIAS }}

      # 只上传分支构建的 debug 包，供手动检查；tag 的产物在下一步挂到 Release。
      - name: Upload debug APK
        if: startsWith(github.ref, 'refs/heads/') && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: flux-mobile-debug-${{ github.ref_name }}
          path: apps/mobile-controller/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Release 资产走 objects.githubusercontent.com，下载速度远高于 Actions artifact，
      # deploy/release-mobile.sh 就从这里取包再转发给 B 机。
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VC=$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)
          VN=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          OUT="flux-mobile-${VN}-vc${VC}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$OUT" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$OUT" --repo "$GITHUB_REPOSITORY" \
              --title "Flux 移动端 ${VN} (vc${VC})" \
              --notes "Flux 移动端 ${VN}（versionCode ${VC}）"
          fi
