# Flux —— M0 持续集成（主规格 §19.1：每个 PR 上 CI 通过）
#
# backend           ：在 SQLite 上跑完整本地自检（ruff / OpenAPI 契约 / 迁移往返 / pytest），
#                     并额外校验契约文件与代码同步；
# frontend          ：对 apps/web-dashboard 跑 TypeScript 类型检查 + Vite 构建 + Vitest 单测；
# postgres-migration：在真实 PostgreSQL（pgvector 官方镜像，与 docker-compose.yml 一致）上
#                     验证初始迁移可 upgrade / downgrade，避免「只在 SQLite 上能跑」。
# backend-windows   ：设计文档 §11.1：Windows 是发行目标平台，后端需在 windows-latest 上
#                     跑一遍 ruff + pytest（双平台同构；绿色是 Windows 发行的硬性前置）。
# desktop-windows   ：设计文档 §10：Windows 安装包（NSIS）只能在 Windows 上构建，
#                     由本 job 在 tag（v*）或手动触发时产出（Linux 侧无 wine，构建不了）。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端自检（ruff / 契约 / 迁移 / pytest）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Makefile 与 scripts/export_openapi.py 都按「仓库根 .venv」约定，故这里建在仓库根
      - name: 创建虚拟环境并安装依赖
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.txt

      - name: 运行本地自检脚本
        run: bash scripts/verify.sh

      # 契约文件必须随代码一起提交：重新导出后若有差异即视为漂移
      - name: 校验 OpenAPI 契约与代码同步
        run: |
          .venv/bin/python scripts/export_openapi.py
          if ! git diff --exit-code docs/openapi.json; then
            echo "::error::docs/openapi.json 与当前代码不一致，请运行 python scripts/export_openapi.py 后提交"
            exit 1
          fi

  frontend:
    name: 前端自检（tsc / vite build / vitest）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-dashboard
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Node 20 与本地开发环境（v20.18.1）保持同一大版本，构建结果可直接对照
      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-dashboard/package-lock.json

      - name: 安装依赖（按 lockfile 精确安装）
        run: npm ci

      - name: 类型检查与构建（tsc -b && vite build）
        run: npm run build

      - name: 单元测试（vitest run）
        run: npm test

  postgres-migration:
    name: PostgreSQL 迁移往返验证
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: flux
          POSTGRES_PASSWORD: flux
          POSTGRES_DB: flux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flux -d flux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 创建虚拟环境并安装依赖
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.txt

      - name: 在 PostgreSQL 上执行迁移 upgrade 与 downgrade
        working-directory: backend
        run: |
          ../.venv/bin/alembic -x db_url=postgresql+asyncpg://flux:flux@localhost:5432/flux upgrade head
          ../.venv/bin/alembic -x db_url=postgresql+asyncpg://flux:flux@localhost:5432/flux downgrade base

  backend-windows:
    # 设计文档 §11.1 / §11.5：Windows 为发行目标，后端必须在 windows-latest 上跑通
    # ruff + pytest。与 ubuntu 的 backend job 同构（不跑 bash 版 verify.sh）。
    name: 后端自检（Windows · ruff / pytest）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: ruff 静态检查
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: pytest 用例
        run: python -m pytest

  desktop-windows:
    # 设计文档 §10：Windows 安装包（NSIS .exe）只能在 Windows 上构建；tag（v*）或手动触发。
    # 完整链路：前端构建 → PyInstaller 后端 sidecar → electron-builder NSIS。
    name: Windows 桌面安装包（NSIS）
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # electron-builder 26.x 依赖 @noble/hashes v2（ESM-only），需要 Node ≥ 22.12
      # 的 require(ESM) 支持，故桌面打包链固定使用 Node 22（前端 CI 仍用 Node 20）。
      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装后端运行时依赖
        run: python -m pip install -r backend/requirements.txt

      - name: 构建前端（apps/web-dashboard/dist）
        working-directory: apps/web-dashboard
        run: |
          npm ci
          npm run build

      - name: 冻结后端 sidecar（PyInstaller onedir）
        working-directory: apps/desktop/backend
        run: |
          python -m pip install -r ../requirements-build.txt
          python -m PyInstaller --noconfirm --clean flux-backend.spec

      - name: 打包 Windows 安装包（electron-builder NSIS）
        working-directory: apps/desktop
        run: |
          npm install
          npx electron-builder --win nsis --publish never

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: flux-windows-nsis
          path: apps/desktop/release/*.exe
          if-no-files-found: error
