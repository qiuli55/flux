name: regenerate-web-lock

on:
  push:
    paths:
      - 'apps/web-dashboard/package.json'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message == 'chore(terminal): prepare lockfile regeneration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmmirror.com

      - name: Regenerate web lockfile
        working-directory: apps/web-dashboard
        run: npm install --package-lock-only --ignore-scripts --registry=https://registry.npmmirror.com

      - name: Commit lockfile and remove helper workflow
        run: |
          rm .github/workflows/regenerate-web-lock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web-dashboard/package-lock.json .github/workflows/regenerate-web-lock.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore(terminal): regenerate web lockfile'
          git push
