# Flux 手机端反代：追加到 flux.qiuli55.top 的 HTTPS server 块里
#
# 为什么带 /mobile 前缀复用现有域名：该域名已有 Let's Encrypt 证书，且本机 DNS 无泛解析，
# 新开子域名要额外做解析与签证书；用一个 location 前缀零 DNS 工作、零新证书。
# 尾斜杠的 proxy_pass 会把 /mobile 前缀剥掉：手机端访问
#   https://flux.qiuli55.top/mobile/api/v1/tasks
# 后端收到的是 /api/v1/tasks（与桌面端同源路径一致，App 不必知道前缀的存在）。
#
# 三条硬约束（缺一个都会出问题，见 apps/mobile-controller/README.md 的排查表）：
# 1) X-Forwarded-For / X-Real-IP 必须转发——后端据此区分"同机直连"与"公网来的请求"，
#    少了它公网请求会被当成回环直连而免鉴权（backend/flux/api/auth.py 的硬约束）；
# 2) proxy_buffering off——否则 SSE（终端实时输出）会被 nginx 攒成一坨再发；
# 3) WebSocket upgrade 必须原样转发——Human Terminal 的 PTY 使用 WS；
# 4) proxy_read_timeout 拉长——Agent 一轮可能跑很久，默认 60s 会把长连接掐断。

location /mobile/ {
    proxy_pass http://127.0.0.1:8801/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE：不缓冲 + 长超时（终端流、长任务轮询都走这里）
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # WebSocket：浏览器的 Upgrade / Connection 头必须传到后端；普通 SSE 请求通常没有 Upgrade，
    # $http_connection 会保持其原始 keep-alive/close 语义。
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    client_max_body_size 8m;
}