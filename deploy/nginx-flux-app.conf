# Flux 移动端分发 · nginx 站点（B 机 flux.app.qiuli55.top）
#
# 目录约定：
#   /opt/downloads/flux-mobile/latest.json                     更新清单
#   /opt/downloads/flux-mobile/flux-mobile-<ver>-vc<code>.apk  安装包
# 两个文件都由 deploy/release-mobile.sh 上传并原子替换。
#
# 安装：
#   sudo cp deploy/nginx-flux-app.conf /etc/nginx/sites-available/flux-app
#   sudo ln -sf ../sites-available/flux-app /etc/nginx/sites-enabled/flux-app
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name flux.app.qiuli55.top;

    # 给 certbot 续期留通道
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name flux.app.qiuli55.top;

    ssl_certificate     /etc/letsencrypt/live/flux.app.qiuli55.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flux.app.qiuli55.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 更新清单不缓存：发版后客户端必须立刻看到新版本
    location = /flux-mobile/latest.json {
        alias /opt/downloads/flux-mobile/latest.json;
        default_type application/json;
        expires -1;
    }

    # 安装包：文件名带版本号，可以长缓存
    location /flux-mobile/ {
        alias /opt/downloads/flux-mobile/;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        expires 1y;
    }
}
