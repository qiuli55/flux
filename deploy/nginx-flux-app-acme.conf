# Flux 移动端分发 · 首次签发证书用的临时站点（只开 80，供 certbot HTTP-01 校验）
#
# 用法（B 机）：
#   sudo cp deploy/nginx-flux-app-acme.conf /etc/nginx/sites-available/flux-app
#   sudo ln -sf ../sites-available/flux-app /etc/nginx/sites-enabled/flux-app
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/html \
#        -d flux.app.qiuli55.top --cert-name flux.app.qiuli55.top \
#        --non-interactive --agree-tos -m qiuli0813@gmail.com
# 签发完成后换成正式配置 nginx-flux-app.conf，再 reload。

server {
    listen 80;
    listen [::]:80;
    server_name flux.app.qiuli55.top;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}
