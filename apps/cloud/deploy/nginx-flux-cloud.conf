# Flux Cloud —— nginx 站点
# 安装：
#   sudo cp deploy/nginx-flux-cloud.conf /etc/nginx/sites-available/flux-cloud
#   sudo ln -sf ../sites-available/flux-cloud /etc/nginx/sites-enabled/flux-cloud
#   sudo certbot --nginx -d flux.qiuli55.top      # 首次签发
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name flux.qiuli55.top;

    # 给 certbot HTTP-01 校验留通道
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name flux.qiuli55.top;

    ssl_certificate     /etc/letsencrypt/live/flux.qiuli55.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flux.qiuli55.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 日志包上传：与 FLUX_CLOUD_MAX_LOG_MB 保持一致并留出 multipart 余量
    client_max_body_size 80m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8500;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
